<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Netatmo Panel</title>
    <style>
        body {
            background: black;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 40px;
        }
        .value {
            font-size: 60px;
            margin-top: 20px;
        }
        .label {
            font-size: 22px;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div class="label">Temperatura interior</div>
    <div id="temp" class="value">--</div>

    <div class="label">Humedad interior</div>
    <div id="hum" class="value">--</div>

    <script>
        var API_URL = "https://iridescent-churros-aa81de.netlify.app/.netlify/functions/netatmo";

        async function loadData() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();

                document.getElementById("temp").innerText = data.temperature + "°C";
                document.getElementById("hum").innerText = data.humidity + "%";

            } catch (e) {
                document.getElementById("temp").innerText = "--";
                document.getElementById("hum").innerText = "--";
            }
        }

        loadData();
        setInterval(loadData, 300000); // cada 5 minutos
    </script>

</body>
</html>
