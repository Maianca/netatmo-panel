<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Panel Netatmo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        padding: 20px;
        font-family: -apple-system, Helvetica, Arial;
        background: #0d0d0d;
        color: #eee;
    }
    h1 {
        text-align: center;
        font-size: 30px;
        margin-bottom: 25px;
        color: #6ab7ff;
    }
    .grid {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 18px;
    }
    .card {
        width: 260px;
        background: #1c1c1c;
        border-radius: 14px;
        padding: 18px;
        box-shadow: 0 0 12px rgba(0,0,0,0.5);
    }
    .card h2 {
        margin: 0 0 12px 0;
        font-size: 20px;
        color: #ffd27f;
    }
    .value {
        font-size: 36px;
        font-weight: bold;
        margin-bottom: 10px;
    }
    .small {
        font-size: 15px;
        opacity: 0.85;
        margin-bottom: 4px;
    }
</style>
</head>

<body>
<h1>Estación Netatmo</h1>

<div class="grid">
    <div class="card" id="modExterior"></div>
    <div class="card" id="modPrincipal"></div>
    <div class="card" id="modPlantaAlta"></div>
    <div class="card" id="modViento"></div>
    <div class="card" id="modLluvia"></div>
</div>

<script>
var API_URL = "https://TU-SITIO.netlify.app/.netlify/functions/netatmo";

function cargarDatos() {
    var xhr = new XMLHttpRequest();
    xhr.open("GET", API_URL, true);

    xhr.onreadystatechange = function() {
        if (xhr.readyState === 4 && xhr.status === 200) {
            var data = JSON.parse(xhr.responseText);

            var station = data.body.devices[0];
            var modules = station.modules;

            function buscar(nombre) {
                for (var i = 0; i < modules.length; i++) {
                    if (modules[i].module_name === nombre) return modules[i];
                }
                return null;
            }

            var exterior = buscar("Módulo Exterior");
            var plantaAlta = buscar("Módulo Planta Alta");
            var viento = buscar("Anemómetro");
            var lluvia = buscar("Pluviómetro");
            var principal = station;

            mostrar("modExterior", "Exterior", exterior.dashboard_data);
            mostrar("modPrincipal", "Principal", principal.dashboard_data);
            mostrar("modPlantaAlta", "Planta Alta", plantaAlta.dashboard_data);
            mostrarViento("modViento", viento.dashboard_data);
            mostrarLluvia("modLluvia", lluvia.dashboard_data);
        }
    };

    xhr.send();
}

function mostrar(id, titulo, d) {
    document.getElementById(id).innerHTML =
        "<h2>" + titulo + "</h2>" +
        "<div class='value'>" + d.Temperature + "°C</div>" +
        "<div class='small'>Humedad: " + d.Humidity + "%</div>";
}

function mostrarViento(id, d) {
    document.getElementById(id).innerHTML =
        "<h2>Viento</h2>" +
        "<div class='value'>" + d.WindStrength + " km/h</div>" +
        "<div class='small'>Dirección: " + d.WindAngle + "°</div>";
}

function mostrarLluvia(id, d) {
    document.getElementById(id).innerHTML =
        "<h2>Lluvia</h2>" +
        "<div class='value'>" + d.Rain + " mm</div>" +
        "<div class='small'>Última hora: " + d.sum_rain_1 + " mm</div>" +
        "<div class='small'>Últimas 24h: " + d.sum_rain_24 + " mm</div>";
}

cargarDatos();
setInterval(cargarDatos, 300000);
</script>

</body>
</html>
